<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QueLess — join the queue, not the crowd. Live queues for clinics, banks, salons and offices near you." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before first paint (ql_theme cookie)
      (function () {
        var m = document.cookie.match(/(?:^|; )ql_theme=(light|dark)/);
        document.documentElement.setAttribute('data-theme', m ? m[1] : 'light');
      })();
    </script>
    <title>QueLess · Join the queue, not the crowd</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
